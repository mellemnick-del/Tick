<title>Tick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Saira:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen watch dial, wordmark on top, prompts underneath. Deliberately single dark theme, like a watch face at night. */
:root {
  --bg: #080d18;
  --bg-glow: #17233d;
  --dial: #0f1a30;
  --red: #c4333d;
  --blue: #1f4c9e;
  --lume: #e6f0cf;
  --ink: #eef1f6;
  --muted: #8592ab;
  --font-num: "Saira Condensed", "Arial Narrow", sans-serif;
  --font-ui: "Saira", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
.top {
  position: absolute; top: 0; left: 0; right: 0;
  padding-top: 18px;
  display: flex; justify-content: center;
  pointer-events: none;
}
.wordmark {
  font-family: var(--font-num); font-weight: 700;
  font-size: 1.5rem; letter-spacing: 0.5em; padding-left: 0.5em;
  color: var(--ink); opacity: 0.9;
}
.bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center; pointer-events: none;
}
.eyebrow {
  font-family: var(--font-num); font-weight: 700; font-size: 1.05rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--red);
  min-height: 1.3em;
}
.eyebrow.good { color: var(--lume); }
.line { font-size: 1rem; color: var(--ink); }
.hint { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.04em; }
.blink { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>

<div id="app">
  <canvas id="c" aria-label="Tick game. Tap when the hand hits the glowing marker."></canvas>
  <div class="top"><div class="wordmark">TICK</div></div>
  <div class="bottom" aria-live="polite">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="line" id="line"></div>
    <div class="hint blink" id="hint"></div>
  </div>
</div>

<script>
(function () {
  const TAU = Math.PI * 2;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const C = {};
  ['bg', 'bg-glow', 'dial', 'red', 'blue', 'lume', 'ink', 'muted'].forEach(k => C[k] = css.getPropertyValue('--' + k).trim());
  const NUM = '"Saira Condensed", "Arial Narrow", sans-serif';

  const elEyebrow = document.getElementById('eyebrow');
  const elLine = document.getElementById('line');
  const elHint = document.getElementById('hint');

  let W = 0, H = 0, cx = 0, cy = 0, R = 100;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W * 0.45, H * 0.34);
    cx = W / 2; cy = H * 0.47;
  }
  window.addEventListener('resize', resize);
  resize();

  // Tuning knobs
  const START_SPEED = 2.0;    // radians per second
  const SPEED_STEP = 0.075;
  const MAX_SPEED = 5.4;
  const START_TOL = 0.19;     // half width of the marker, radians
  const MIN_TOL = 0.11;
  const GRACE = 0.025;        // a little forgiveness beyond the drawn marker

  let best = 0;
  try { best = parseInt(localStorage.getItem('tick.best'), 10) || 0; } catch (e) {}

  const S = {
    state: 'ready', score: 0, hand: -Math.PI / 2, dir: 1,
    speed: START_SPEED, tol: START_TOL, target: 0, remaining: 0,
    flash: 0, shake: 0, pop: 0, deadAt: 0, reason: '', newBest: false
  };
  const pops = [];

  function newTarget() {
    const gap = (0.5 + Math.random() * 1.1) * Math.PI;
    S.remaining = gap;
    S.target = S.hand + S.dir * gap;
  }

  function start() {
    S.state = 'play'; S.score = 0; S.dir = 1;
    S.speed = START_SPEED; S.tol = START_TOL;
    S.hand = -Math.PI / 2; S.newBest = false;
    newTarget(); ui();
  }

  function hit() {
    S.score++;
    pops.push({ a: S.target, born: performance.now() });
    S.dir *= -1;
    S.speed = Math.min(MAX_SPEED, START_SPEED + S.score * SPEED_STEP);
    S.tol = Math.max(MIN_TOL, START_TOL - S.score * 0.0025);
    S.pop = 1;
    sfxTick();
    newTarget();
  }

  function miss(reason) {
    S.state = 'over'; S.reason = reason;
    S.flash = 1; S.shake = 1; S.deadAt = performance.now();
    if (S.score > best) {
      best = S.score; S.newBest = true;
      try { localStorage.setItem('tick.best', String(best)); } catch (e) {}
    }
    sfxMiss(); ui();
  }

  function tap() {
    unlockAudio();
    if (S.state === 'ready') { start(); return; }
    if (S.state === 'over') {
      if (performance.now() - S.deadAt > 550) start();
      return;
    }
    if (Math.abs(S.remaining) <= S.tol + GRACE) hit();
    else miss(S.remaining > 0 ? 'Too early' : 'Too late');
  }

  cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); }
  });

  function ui() {
    elEyebrow.classList.remove('good');
    if (S.state === 'ready') {
      elEyebrow.textContent = '';
      elLine.textContent = 'Tap when the hand hits the glowing marker.';
      elHint.textContent = 'Tap anywhere to start';
    } else if (S.state === 'play') {
      elEyebrow.textContent = ''; elLine.textContent = ''; elHint.textContent = '';
    } else {
      if (S.newBest) { elEyebrow.textContent = 'New best'; elEyebrow.classList.add('good'); }
      else elEyebrow.textContent = S.reason;
      elLine.textContent = S.score === 1 ? '1 tick' : S.score + ' ticks';
      elHint.textContent = 'Tap to try again';
    }
  }

  // Sound
  let ac = null;
  function unlockAudio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function blip(f0, f1, dur, type, vol) {
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxTick() {
    const f = Math.min(3200, 1600 + S.score * 25);
    blip(f, f * 0.6, 0.04, 'square', 0.08);
    blip(f / 2, f / 3, 0.06, 'triangle', 0.12);
  }
  function sfxMiss() { blip(220, 55, 0.4, 'sawtooth', 0.12); }

  // Drawing
  function polar(a, r) { return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }

  function drawBezel() {
    const br = R * 0.92, bw = R * 0.16;
    ctx.lineWidth = bw;
    ctx.strokeStyle = C.red;
    ctx.beginPath(); ctx.arc(cx, cy, br, Math.PI, TAU); ctx.stroke();
    ctx.strokeStyle = C.blue;
    ctx.beginPath(); ctx.arc(cx, cy, br, 0, Math.PI); ctx.stroke();

    ctx.lineWidth = Math.max(1, R * 0.008);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();

    // 24 hour scale
    ctx.fillStyle = C.ink;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 ' + Math.round(R * 0.085) + 'px ' + NUM;
    for (let h = 0; h < 24; h++) {
      const a = h / 24 * TAU - Math.PI / 2;
      const [x, y] = polar(a, br);
      if (h === 0) {
        const s = R * 0.055;
        ctx.beginPath();
        ctx.moveTo(x, y + s); ctx.lineTo(x - s, y - s * 0.8); ctx.lineTo(x + s, y - s * 0.8);
        ctx.closePath(); ctx.fill();
      } else if (h % 2 === 0) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
        ctx.fillText(String(h), 0, 0); ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(x, y, R * 0.012, 0, TAU); ctx.fill();
      }
    }
  }

  function drawDial() {
    const dr = R * 0.84;
    const g = ctx.createRadialGradient(cx, cy - dr * 0.4, dr * 0.1, cx, cy, dr);
    g.addColorStop(0, '#1a2a4a'); g.addColorStop(1, C.dial);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, dr, 0, TAU); ctx.fill();

    // minute track
    ctx.strokeStyle = C.muted;
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * TAU - Math.PI / 2;
      const big = i % 5 === 0;
      const [x1, y1] = polar(a, R * 0.81);
      const [x2, y2] = polar(a, R * (big ? 0.735 : 0.765));
      ctx.lineWidth = big ? R * 0.012 : R * 0.006;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    // hour markers, dimmed so the target stands out
    ctx.fillStyle = C.lume; ctx.globalAlpha = 0.5;
    for (let h = 0; h < 12; h++) {
      const a = h / 12 * TAU - Math.PI / 2;
      const [x, y] = polar(a, R * 0.65);
      if (h === 0) {
        const s = R * 0.05;
        ctx.beginPath();
        ctx.moveTo(x, y + s); ctx.lineTo(x - s, y - s * 0.7); ctx.lineTo(x + s, y - s * 0.7);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x, y, R * (h % 3 === 0 ? 0.04 : 0.032), 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // dial text: score and best
    const s = 1 + S.pop * 0.18;
    ctx.fillStyle = C.ink;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(R * 0.3 * s) + 'px ' + NUM;
    ctx.fillText(String(S.state === 'ready' ? best : S.score), cx, cy - R * 0.32);
    ctx.fillStyle = C.muted;
    ctx.font = '500 ' + Math.round(R * 0.075) + 'px ' + NUM;
    ctx.fillText(S.state === 'ready' ? 'BEST' : 'BEST ' + best, cx, cy + R * 0.34);
  }

  function drawTarget(now) {
    if (S.state === 'ready') return;
    const pulse = 0.75 + 0.25 * Math.sin(now / 140);
    ctx.save();
    ctx.lineCap = 'butt';
    ctx.strokeStyle = C.lume;
    ctx.globalAlpha = S.state === 'over' ? 0.35 : pulse;
    ctx.shadowColor = C.lume; ctx.shadowBlur = R * 0.12;
    ctx.lineWidth = R * 0.1;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.755, S.target - S.tol, S.target + S.tol);
    ctx.stroke();
    ctx.restore();
  }

  function drawPops(now) {
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i];
      const k = (now - p.born) / 450;
      if (k >= 1) { pops.splice(i, 1); continue; }
      const [x, y] = polar(p.a, R * 0.755);
      ctx.strokeStyle = C.lume;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = R * 0.02 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(x, y, R * (0.05 + k * 0.16), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHand() {
    const a = S.hand, L = R * 0.76, tail = R * 0.2, w = R * 0.032;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(a);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = R * 0.04; ctx.shadowOffsetY = R * 0.015;
    ctx.fillStyle = C.ink;
    ctx.beginPath();
    ctx.moveTo(-tail, -w * 0.8);
    ctx.lineTo(L - w * 3, -w);
    ctx.lineTo(L, 0);
    ctx.lineTo(L - w * 3, w);
    ctx.lineTo(-tail, w * 0.8);
    ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'transparent';
    // lume inlay near the tip
    ctx.fillStyle = C.lume;
    ctx.fillRect(L * 0.45, -w * 0.45, L * 0.38, w * 0.9);
    ctx.restore();
    // pivot
    ctx.fillStyle = C.red;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.055, 0, TAU); ctx.fill();
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.018, 0, TAU); ctx.fill();
  }

  function draw(now) {
    const g = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, Math.max(W, H) * 0.8);
    g.addColorStop(0, C['bg-glow']); g.addColorStop(1, C.bg);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake * R * 0.08, (Math.random() - 0.5) * S.shake * R * 0.08);
    drawBezel();
    drawDial();
    drawTarget(now);
    drawPops(now);
    drawHand();
    if (S.flash > 0) {
      ctx.fillStyle = C.red; ctx.globalAlpha = S.flash * 0.4;
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.84, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (S.state === 'ready') {
      // ticks like a seconds hand while waiting
      S.hand = -Math.PI / 2 + Math.floor(now / 1000) * TAU / 60;
    } else if (S.state === 'play') {
      S.hand += S.dir * S.speed * dt;
      S.remaining -= S.speed * dt;
      if (S.remaining < -(S.tol + GRACE)) miss('Too late');
    }
    S.pop = Math.max(0, S.pop - dt * 5);
    S.flash = Math.max(0, S.flash - dt * 2.2);
    S.shake = Math.max(0, S.shake - dt * 3.5);
    draw(now);
    requestAnimationFrame(frame);
  }

  ui();
  requestAnimationFrame(frame);
})();
</script>
